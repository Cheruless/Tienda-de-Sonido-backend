spring:
  application:
    name: catalog-service
  datasource:
    url: jdbc:mysql://localhost:3306/tienda_catalogo?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8082

jwt:
  secret: ${JWT_SECRET:cambia-este-secreto-por-uno-de-minimo-32-caracteres-seguro}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
