spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service-auth
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth/**
              filters:
                - RemoveRequestHeader=Origin
            - id: auth-service-users
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/users/**
              filters:
                - RemoveRequestHeader=Origin
            - id: catalog-service
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/**
              filters:
                - RemoveRequestHeader=Origin
            - id: cart-service
              uri: ${CART_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/cart/**
              filters:
                - RemoveRequestHeader=Origin

server:
  port: 8080

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}